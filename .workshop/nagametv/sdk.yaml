name: nagametv
title: NagameTV development SDK
base: ubuntu@26.04
version: "0.2"
summary: Qt 6, GStreamer, and packaging tools for NagameTV
description: |
  Installs the complete reproducible build and runtime environment for the
  Qt/QML and Rust Mirakurun live television client, including AppImage and
  Flatpak packaging tools. Rust is supplied by the separate Rust SDK.
