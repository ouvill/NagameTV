name: dev
base: ubuntu@26.04
sdks:
  - name: flutter
  - name: codex
  - name: rust
  - name: docker-ce
    channel: latest/stable
  - name: project-codex-latest
  - name: project-nagametv
  - name: project-gui

connections:
  - plug: gui:gpu
    slot: system:gpu

actions:
  configure: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
  build: |
    cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    cmake --build build
  test: cargo test --manifest-path rust/Cargo.toml "$@"
  gui-test: python3 scripts/run-gui-tests.py "$@"
  run: bash scripts/run-viewer.sh "$@"
  profile-memory: bash scripts/profile-memory.sh "$@"
  analyze-memory: python3 scripts/analyze-memory.py "$@"
