name: dev
base: ubuntu@24.04
sdks:
  - name: flutter
  - name: codex
  - name: rust
  - name: project-codex-latest
  - name: project-mirakurun-viewer
  - name: project-gui
  - name: system
    slots:
      pulse:
        interface: tunnel
        endpoint: $XDG_RUNTIME_DIR/pulse/native

connections:
  - plug: gui:desktop
    slot: system:desktop

  - plug: gui:gpu
    slot: system:gpu

  - plug: gui:pulse
    slot: system:pulse

actions:
  configure: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
  build: |
    cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    cmake --build build
  test: cargo test --manifest-path rust/Cargo.toml "$@"
  run: QT_QPA_PLATFORM=xcb ./build/mirakurun-viewer "$@"
  test-ui: |
    MIRAKURUN_SERVER=http://192.168.3.3:40772 \
    MIRAKURUN_SERVICE_ID= \
    MIRAKURUN_AUTOPLAY=0 \
    scripts/run-isolated-ui.sh "$@"
  test-stream-isolated: |
    MIRAKURUN_SERVER=http://192.168.3.3:40772 \
    MIRAKURUN_SERVICE_ID=3203246080 \
    MIRAKURUN_AUTOPLAY=1 \
    MIRAKURUN_DEINTERLACE=linear \
    scripts/run-isolated-ui.sh "$@"
