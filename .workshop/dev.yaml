name: dev
base: ubuntu@26.04
sdks:
  - name: codex
  - name: opencode
    channel: latest/stable
  - name: claude-code
    channel: latest/stable
  - name: rust
  - name: docker-ce
    channel: latest/stable
  - name: project-codex-latest
  - name: project-nagametv
  - name: project-herdr
  - name: project-gui

connections:
  - plug: gui:gpu
    slot: system:gpu

actions:
  setup-tests: bash scripts/testing/install-nextest.sh
  configure: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNAGAMETV_DISTRIBUTION=OFF
  build: |
    cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNAGAMETV_DISTRIBUTION=OFF
    cmake --build build
  test: python3 scripts/test.py "$@"
  gui-test: python3 -m scripts.testing.gui_session "$@"
  run: bash scripts/dev/run-viewer.sh "$@"
  profile-memory: bash scripts/dev/profile-memory.sh "$@"
  analyze-memory: python3 -m scripts.dev.analyze_memory "$@"
