name: gui
title: GPU and PipeWire environment for GUI tests
base: ubuntu@26.04
version: "0.4"
summary: GPU access and container-local PipeWire without host desktop sharing
description: |
  Exposes GPU devices and starts container-local PipeWire services. GUI tests
  start their own display and create per-run virtual outputs on PipeWire.
license: MIT

plugs:
  gpu:
    interface: gpu
