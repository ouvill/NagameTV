version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /packaging/appimage
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /packaging/deb
    schedule:
      interval: weekly
