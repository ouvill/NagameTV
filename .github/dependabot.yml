version: 2
updates:
  - package-ecosystem: cargo
    # Independent test crates have their own lockfiles; /rust alone misses them.
    directories:
      - /rust
      - /rust/crates/arib-b24
      - /rust/crates/tsreadex
      - /rust/crates/viewer-build-info
      - /rust/crates/viewer-comments
      - /rust/crates/viewer-diagnostics
      - /rust/crates/viewer-epg-events
      - /rust/crates/viewer-mpegts
      - /rust/crates/viewer-remote
      - /rust/crates/viewer-translations
      - /rust/crates/viewer-web-bml
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /packaging/appimage
    schedule:
      interval: weekly
    # 24.04 is the glibc 2.39 baseline the AppImage runs on; only take new digests of it.
    ignore:
      - dependency-name: ubuntu
        versions: ['> 24.04']
  - package-ecosystem: docker
    directory: /packaging/deb
    schedule:
      interval: weekly
    # This deb targets Ubuntu 26.04 by name; a newer release needs its own deb.
    ignore:
      - dependency-name: ubuntu
        versions: ['> 26.04']
