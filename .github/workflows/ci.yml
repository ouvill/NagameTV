name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # Let main builds finish independently; serialize their publication below.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_run_id: ${{ steps.reuse.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate versions and pinned sources
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$REF_TYPE" == tag ]]; then args+=(--tag "$REF_NAME"); fi
          python3 -m scripts.packaging.check_release_metadata "${args[@]}" --github-output "$GITHUB_OUTPUT"
          python3 -m scripts.packaging.flatpak_cargo_sources --check
      - name: Test release guards
        run: python3 -m unittest discover -s tests/tooling -p test_release.py
      - name: Find verified main artifacts for this tag
        if: github.ref_type == 'tag'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$GITHUB_SHA&status=success&per_page=100" \
            --jq '.workflow_runs[].id')
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and .size_in_bytes > 0) | .name')
            complete=true
            for required in appimage-x86_64 flatpak-x86_64 deb-ubuntu24.04-amd64 deb-ubuntu26.04-amd64; do
              if [[ $'\n'"$artifacts"$'\n' != *$'\n'"$required"$'\n'* ]]; then
                complete=false
                break
              fi
            done
            if [[ "$complete" == true ]]; then
              echo "source_run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Reusing verified artifacts from main run $run_id"
              break
            fi
          done <<< "$runs"
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          git ls-files -z 'scripts/**/*.sh' | xargs -0 shellcheck

  appimage:
    name: Tests, AppImage and deb (Ubuntu 24.04, x86_64)
    needs: metadata
    if: needs.metadata.outputs.source_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Ubuntu 24.04 test and distribution environment
        id: build-environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/appimage
          target: ci
          load: true
          tags: nagametv-ci:local
          cache-from: type=gha,scope=ubuntu24-ci
          # Branches restore main's layers without exporting duplicate caches.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ubuntu24-ci' || '' }}
      - name: Restore source downloads and verified packaging tools
        id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/ci/cargo-home/registry
            build/ci/cargo-home/git
            build/appimage/tools
          key: sources-${{ runner.os }}-x86_64-${{ hashFiles('rust/**/Cargo.lock', 'scripts/packaging/build-appimage.sh') }}
          restore-keys: sources-${{ runner.os }}-x86_64-
      - name: Restore compiled Cargo dependencies (Ubuntu 24.04)
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Separate native ABIs/toolchains. Do not cache copied test runners or
          # incremental state; local Workshop artifacts never enter this path.
          path: |
            build/ci/cargo
          # Dependencies change with the environment/manifests, not every commit.
          key: cargo-ubuntu24-v3-${{ steps.build-environment.outputs.imageid }}-${{ hashFiles('.cargo/config.toml', 'rust/**/Cargo.toml') }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu24-v3-${{ steps.build-environment.outputs.imageid }}-${{ hashFiles('.cargo/config.toml', 'rust/**/Cargo.toml') }}-
            cargo-ubuntu24-v3-${{ steps.build-environment.outputs.imageid }}-
      - name: Restore C++ compilation cache (Ubuntu 24.04)
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ccache-ubuntu24-v1-${{ steps.build-environment.outputs.imageid }}-${{ github.sha }}
          restore-keys: ccache-ubuntu24-v1-${{ steps.build-environment.outputs.imageid }}-
      - name: Limit C++ cache size
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/project" \
            --env CCACHE_DIR=/project/build/ccache \
            nagametv-ci:local ccache --max-size 500M
      - name: Run hardware-free tests
        run: |
          # D-Bus needs NSS entries for the runner's UID/GID inside Docker.
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/project" \
            --mount type=bind,src=/etc/passwd,dst=/etc/passwd,readonly \
            --mount type=bind,src=/etc/group,dst=/etc/group,readonly \
            --env CARGO_HOME=/project/build/ci/cargo-home \
            --env CARGO_TARGET_DIR=/project/build/ci/cargo \
            --env CARGO_BUILD_JOBS="$(nproc)" \
            nagametv-ci:local python3 -m scripts.build.fresh_local_crates bash scripts/testing/ci.sh
      - name: Preserve test logs and execution summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            build/test-runs/**/*.log
            build/test-runs/**/summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify the real EPGStation API and captured fixtures
        env:
          CARGO_HOME: /project/build/ci/cargo-home
          CARGO_TARGET_DIR: /project/build/ci/cargo
        run: CARGO_BUILD_JOBS=$(nproc) python3 -m scripts.testing.epgstation_integration --client-image nagametv-ci:local
      - name: Preserve EPGStation contract diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: epgstation-contract
          path: build/epgstation-contract/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build AppImage and validate the glibc baseline
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/project" \
            --env CARGO_HOME=/project/build/ci/cargo-home \
            --env APPIMAGE_BUILD_DIR=/project/build/ci \
            --env APPIMAGE_BUILD_JOBS="$(nproc)" \
            nagametv-ci:local bash scripts/packaging/build-appimage.sh --native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-x86_64
          path: |
            build/appimage/nagametv-${{ needs.metadata.outputs.version }}-x86_64.AppImage
            build/appimage/nagametv-${{ needs.metadata.outputs.version }}-x86_64.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Package Ubuntu 24.04 deb from the verified AppImage
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/project" \
            nagametv-ci:local bash scripts/packaging/build-deb.sh 24.04 --native \
              --appimage "/project/build/appimage/nagametv-$VERSION-x86_64.AppImage"
      - name: Restore Ubuntu 24.04 deb test downloads
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # apt's root-owned lock/partial cannot be archived by the runner user.
          path: build/deb/apt-cache/ubuntu24.04/archives/*.deb
          key: apt-ubuntu24-v2-${{ github.sha }}
          restore-keys: apt-ubuntu24-v2-
      - name: Install and remove deb in a clean Ubuntu 24.04 container
        run: bash scripts/packaging/test-deb.sh 24.04
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-ubuntu24.04-amd64
          path: |
            build/deb/ubuntu24.04/*.deb
            build/deb/ubuntu24.04/*.deb.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Keep shared caches on main; PR and tag caches cannot seed other branches.
      - name: Save source downloads and verified packaging tools
        if: github.ref == 'refs/heads/main' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/ci/cargo-home/registry
            build/ci/cargo-home/git
            build/appimage/tools
          key: ${{ steps.sources.outputs.cache-primary-key }}
      - name: Save compiled Cargo dependencies (Ubuntu 24.04)
        if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          # The cache glob selects a directory; GNU tar then recurses into it.
          # Exclude generated binaries/incremental data at the archive boundary.
          TAR_OPTIONS: --exclude=incremental --exclude=nagametv --exclude=*/deps/nagametv-*
        with:
          path: |
            build/ci/cargo
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Save C++ compilation cache (Ubuntu 24.04)
        if: github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Save Ubuntu 24.04 deb test downloads
        if: github.ref == 'refs/heads/main' && steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/deb/apt-cache/ubuntu24.04/archives/*.deb
          key: ${{ steps.apt.outputs.cache-primary-key }}

  deb:
    name: deb (Ubuntu 26.04, amd64)
    needs: metadata
    if: needs.metadata.outputs.source_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Ubuntu 26.04 distribution environment
        id: build-environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/deb
          load: true
          tags: nagametv-deb-ubuntu26:local
          cache-from: type=gha,scope=ubuntu26-deb
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ubuntu26-deb' || '' }}
      - name: Restore source downloads (Ubuntu 26.04)
        id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/deb/ubuntu26.04/cargo-home/registry
            build/deb/ubuntu26.04/cargo-home/git
          key: sources-deb-ubuntu26-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: sources-deb-ubuntu26-
      - name: Restore compiled Cargo dependencies (Ubuntu 26.04)
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/deb/ubuntu26.04/native/cargo
          key: cargo-ubuntu26-v3-${{ steps.build-environment.outputs.imageid }}-${{ hashFiles('.cargo/config.toml', 'rust/**/Cargo.toml') }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu26-v3-${{ steps.build-environment.outputs.imageid }}-${{ hashFiles('.cargo/config.toml', 'rust/**/Cargo.toml') }}-
            cargo-ubuntu26-v3-${{ steps.build-environment.outputs.imageid }}-
      - name: Restore C++ compilation cache (Ubuntu 26.04)
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ccache-ubuntu26-v1-${{ steps.build-environment.outputs.imageid }}-${{ github.sha }}
          restore-keys: ccache-ubuntu26-v1-${{ steps.build-environment.outputs.imageid }}-
      - name: Limit C++ cache size
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/project" \
            --env CCACHE_DIR=/project/build/ccache \
            nagametv-deb-ubuntu26:local ccache --max-size 500M
      - name: Build Ubuntu 26.04 deb
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/project" \
            --env CARGO_HOME=/project/build/deb/ubuntu26.04/cargo-home \
            --env CARGO_TARGET_DIR=/project/build/deb/ubuntu26.04/native/cargo \
            --env DEB_BUILD_JOBS="$(nproc)" \
            nagametv-deb-ubuntu26:local python3 -m scripts.build.fresh_local_crates \
              bash scripts/packaging/build-deb.sh 26.04 --native
      - name: Install and remove deb in a clean Ubuntu 26.04 container
        run: bash scripts/packaging/test-deb.sh 26.04
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-ubuntu26.04-amd64
          path: |
            build/deb/ubuntu26.04/*.deb
            build/deb/ubuntu26.04/*.deb.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Save source downloads (Ubuntu 26.04)
        if: github.ref == 'refs/heads/main' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/deb/ubuntu26.04/cargo-home/registry
            build/deb/ubuntu26.04/cargo-home/git
          key: ${{ steps.sources.outputs.cache-primary-key }}
      - name: Save compiled Cargo dependencies (Ubuntu 26.04)
        if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          TAR_OPTIONS: --exclude=incremental --exclude=nagametv --exclude=*/deps/nagametv-*
        with:
          path: |
            build/deb/ubuntu26.04/native/cargo
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Save C++ compilation cache (Ubuntu 26.04)
        if: github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  flatpak:
    name: Flatpak (x86_64)
    needs: metadata
    if: needs.metadata.outputs.source_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak flatpak-builder elfutils dbus-daemon librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Restore Flatpak build state
        id: flatpak
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/flatpak/state
          key: flatpak-x86_64-${{ hashFiles('packaging/flatpak/*.json') }}-${{ github.sha }}
          restore-keys: |
            flatpak-x86_64-${{ hashFiles('packaging/flatpak/*.json') }}-
            flatpak-x86_64-
      - name: Build Flatpak bundle
        run: FLATPAK_BUILD_JOBS=$(nproc) dbus-run-session -- bash scripts/packaging/build-flatpak.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-x86_64
          path: |
            build/flatpak/nagametv-${{ needs.metadata.outputs.version }}-x86_64.flatpak
            build/flatpak/nagametv-${{ needs.metadata.outputs.version }}-x86_64.flatpak.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Save Flatpak build state
        if: github.ref == 'refs/heads/main' && steps.flatpak.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/flatpak/state
          key: ${{ steps.flatpak.outputs.cache-primary-key }}

  release:
    name: GitHub Release
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
      needs.metadata.result == 'success' &&
      (needs.metadata.outputs.source_run_id != '' ||
       (needs.appimage.result == 'success' && needs.flatpak.result == 'success' && needs.deb.result == 'success'))
    needs: [metadata, appimage, flatpak, deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
      # Older builds must not evict a newer build already waiting to publish.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage-x86_64
          path: build/release
          run-id: ${{ needs.metadata.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-x86_64
          path: build/release
          run-id: ${{ needs.metadata.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deb-ubuntu*-amd64
          merge-multiple: true
          path: build/release
          run-id: ${{ needs.metadata.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify assets and create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            bash scripts/packaging/create-release.sh "$RELEASE_TAG" build/release
          else
            bash scripts/packaging/create-release.sh "v$VERSION" build/release --latest-build
          fi
