name: nagametv
base: core26
adopt-info: nagametv
summary: Watch Japanese TV with subtitles and live comments
description: |
  Watch a Mirakurun or mirakc stream or play recordings from EPGStation.
  Run NagameTV from a Wayland desktop or as a kiosk service with Ubuntu Frame.
grade: devel
confinement: strict
platforms:
  amd64:
  arm64:

icon: packaging/linux/io.github.ouvill.nagametv.svg

plugs:
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604

slots:
  mpris:
    interface: mpris

layout:
  /etc/fonts:
    bind: $SNAP/etc/fonts
  /usr/share/fontconfig:
    bind: $SNAP/usr/share/fontconfig
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/share/X11/locale:
    bind: $SNAP/usr/share/nagametv/x11-locale
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

apps:
  nagametv:
    command: usr/bin/nagametv
    command-chain:
      - usr/bin/nagametv-snap-launch
      - bin/gpu-2604-wrapper
    desktop: usr/share/applications/io.github.ouvill.nagametv.desktop
    slots: [mpris]
    environment:
      HOME: $SNAP_USER_DATA
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
      # Large caches are shared across refreshes and reverts.
      XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
      XDG_DATA_HOME: $SNAP_USER_DATA/.local/share
      XDG_STATE_HOME: $SNAP_USER_DATA/.local/state
    plugs:
      - wayland
      - opengl
      - gpu-2604
      - desktop
      - screen-inhibit-control
      - audio-playback
      - network
      - network-bind
      - home
      - removable-media
      - camera
      - media-control
  kiosk:
    command: usr/bin/nagametv --kiosk
    command-chain:
      - usr/bin/nagametv-snap-launch
      - bin/gpu-2604-wrapper
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    restart-delay: 5s
    environment:
      NAGAMETV_SNAP_KIOSK: "1"
      HOME: $SNAP_DATA
      XDG_CONFIG_HOME: $SNAP_DATA/.config
      XDG_CACHE_HOME: $SNAP_COMMON/.cache
      XDG_DATA_HOME: $SNAP_DATA/.local/share
      XDG_STATE_HOME: $SNAP_DATA/.local/state
    plugs:
      - wayland
      - opengl
      - gpu-2604
      - audio-playback
      - alsa
      - network
      - network-bind
      - removable-media
      - camera
      - media-control

parts:
  nagametv:
    plugin: nil
    source: .
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - git
      - libass-dev
      - libclang-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer-plugins-bad1.0-dev
      - lld
      - pkg-config
      - python3
      - qmake6
      - qt6-base-dev
      - qt6-declarative-dev
      - qt6-declarative-dev-tools
      - qt6-l10n-tools
      - qt6-webengine-dev
      - rustup
    # Keep the dynamically loaded modules aligned with the Ubuntu 26.04 deb.
    stage-packages:
      - fontconfig-config
      - fonts-noto-cjk
      - glib-networking
      - gstreamer1.0-alsa
      - gstreamer1.0-gl
      - gstreamer1.0-libav
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-pulseaudio
      - gstreamer1.0-qt6
      - libass9
      - libqt6webenginecore6-bin
      - libx11-data
      - libsoup-3.0-0
      - qml6-module-qtcore
      - qml6-module-qtqml
      - qml6-module-qtqml-models
      - qml6-module-qtqml-workerscript
      - qml6-module-qtquick
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-dialogs
      - qml6-module-qtquick-effects
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-shapes
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-window
      - qml6-module-qtwebengine
      - qml6-module-qtwebchannel
      - qt6-image-formats-plugins
      - qt6-qpa-plugins
      - qt6-svg-plugins
      - qt6-wayland
      - qt6-xdgdesktopportal-platformtheme
    override-build: |
      test -f third_party/libaribcaption/CMakeLists.txt
      test -f third_party/tsreadex/License.txt
      version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"])')
      craftctl set version="$version"

      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup"
      export CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      rustup toolchain install 1.98.1 --profile minimal
      rustup run 1.98.1 cmake -S . -B build/snap-release -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr -DNAGAMETV_DISTRIBUTION=ON
      rustup run 1.98.1 cmake --build build/snap-release
      DESTDIR="$CRAFT_PART_INSTALL" cmake --install build/snap-release
      # Compose files include absolute paths. Keep a copy outside the GPU cleanup's paths.
      locale_dir="$CRAFT_PART_INSTALL/usr/share/nagametv/x11-locale"
      install -d "$locale_dir"
      cp -a "$CRAFT_PART_INSTALL/usr/share/X11/locale/." "$locale_dir/"
      install -m755 snap/local/launch "$CRAFT_PART_INSTALL/usr/bin/nagametv-snap-launch"
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/io.github.ouvill.nagametv.svg|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.ouvill.nagametv.desktop"
    prime:
      - -usr/share/doc
      - -usr/share/man

  gpu-2604:
    after: [nagametv]
    plugin: dump
    source: https://github.com/canonical/gpu-snap.git
    source-type: git
    source-commit: 7c4091ddcea8f969b98a752c48841af9b0a659d8
    stage:
      - bin/gpu-2604-wrapper
    override-prime: |
      craftctl default
      "$CRAFT_PART_SRC/bin/gpu-2604-cleanup" mesa-2604

      # Check modules resolved at runtime that the ELF dependency scan cannot see.
      lib="$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      for required in \
        "$lib/qt6/plugins/platforms/libqwayland.so" \
        "$lib/qt6/qml/QtWebEngine/qmldir" \
        "$lib/gstreamer-1.0/libgstqml6.so" \
        "$lib/gstreamer-1.0/libgstlibav.so" \
        "$lib/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner" \
        "$CRAFT_PRIME/usr/lib/qt6/libexec/QtWebEngineProcess" \
        "$CRAFT_PRIME/usr/share/qt6/resources/qtwebengine_resources.pak" \
        "$CRAFT_PRIME/etc/fonts/fonts.conf" \
        "$CRAFT_PRIME/usr/share/nagametv/x11-locale/en_US.UTF-8/Compose" \
        "$CRAFT_PRIME/usr/share/nagametv/x11-locale/ja_JP.UTF-8/Compose"
      do
        if [ ! -f "$required" ]; then
          echo "Missing snap runtime file: $required" >&2
          exit 1
        fi
      done
