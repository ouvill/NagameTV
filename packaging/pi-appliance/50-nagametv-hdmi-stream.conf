stream.rules = [
  {
    matches = [ { media.class = "Stream/Output/Audio" target.object = "nagametv-hdmi0" } ]
    actions = {
      update-props = {
        # Keep the stream alive across removal of its sink. Following the
        # default or a remembered target could move it onto Dummy Output.
        node.dont-fallback = true
        node.dont-move = true
        node.linger = true
      }
    }
  }
]
