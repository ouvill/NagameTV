monitor.alsa.rules = [
  {
    # The default otherwise favors the Pi 4 analog jack.
    matches = [ { api.alsa.card.name = "bcm2835 Headphones" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    # A stable name lets the Pulse stream reconnect after the node is recreated.
    matches = [ { api.alsa.card.name = "vc4-hdmi-0" media.class = "Audio/Sink" } ]
    actions = { update-props = { node.name = "nagametv-hdmi0" } }
  }
]
