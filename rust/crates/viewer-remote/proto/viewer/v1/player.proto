syntax = "proto3";

package viewer.v1;

// Controls one running desktop viewer on a trusted home LAN. All RPCs are available
// without authentication to clients that can reach the configured listener.
// Commands run in order on the player's Qt thread. Success acknowledges command
// execution, not receipt of video or durable settings storage. Observe WatchState
// for asynchronous playback failures. Timed-out commands may already have run;
// reconcile using GetState before retrying. No command is automatically replayed.
service PlayerService {
  // Returns the current catalog in the viewer's channel order, including subchannels.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  // Returns the most recently published state (normally within one 50 ms UI tick).
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  // Sends a full state immediately, then the latest state on change. Slow readers
  // may skip intermediate states. Reconnect explicitly; every connection starts
  // with a fresh full state. Revisions are scoped to this server lifetime.
  rpc WatchState(WatchStateRequest) returns (stream WatchStateResponse);
  // Selects a catalog ID and starts playback. Unknown IDs return NOT_FOUND.
  rpc SelectChannel(SelectChannelRequest) returns (SelectChannelResponse);
  // Starts the selected channel or replays the locally selected recording.
  // Resumes a paused recording; restarts an ended recording from the beginning.
  // No selection/output returns FAILED_PRECONDITION. Does not open arbitrary files.
  rpc Play(PlayRequest) returns (PlayResponse);
  // Stops playback and cancels pending startup autoplay. Safe to repeat.
  rpc Stop(StopRequest) returns (StopResponse);
  // Sets the volume fraction and unmutes, matching the desktop volume slider.
  rpc SetVolume(SetVolumeRequest) returns (SetVolumeResponse);
  // Sets mute explicitly. Unmuting restores the selected volume.
  rpc SetMuted(SetMutedRequest) returns (SetMutedResponse);
  // Controls subtitle display. A disabled subtitle feature returns FAILED_PRECONDITION.
  rpc SetSubtitles(SetSubtitlesRequest) returns (SetSubtitlesResponse);
  // Explicit pause/resume. Requires can_pause; safe to repeat.
  rpc SetPaused(SetPausedRequest) returns (SetPausedResponse);
  // Relative to the current position; clamps to the current seekable range.
  rpc SeekRelative(SeekRelativeRequest) returns (SeekRelativeResponse);
  // Uses the same millisecond timeline as PlayerState; clamps to its seekable range.
  rpc SeekTo(SeekToRequest) returns (SeekToResponse);
  // Returns retained live playback to the live edge and normal speed.
  rpc ReturnToLive(ReturnToLiveRequest) returns (ReturnToLiveResponse);
  // Changes speed in tenths, matching the desktop controls. Requires can_set_rate.
  rpc SetPlaybackRate(SetPlaybackRateRequest) returns (SetPlaybackRateResponse);
  // Uses the desktop channel order and program-aware subchannel skipping.
  rpc StepChannel(StepChannelRequest) returns (StepChannelResponse);
  // Selects the last viewed channel using desktop viewing history.
  rpc PreviousChannel(PreviousChannelRequest) returns (PreviousChannelResponse);
  // Selects a remote-control number, using the viewed/selected band when unspecified.
  rpc SelectRemoteKey(SelectRemoteKeyRequest) returns (SelectRemoteKeyResponse);
  // Success means the validated key was emitted to QML on the Qt thread, not
  // that QML completed an action. Unknown and unspecified keys are rejected.
  rpc SendKey(SendKeyRequest) returns (SendKeyResponse);
}

message ListChannelsRequest {}
message ListChannelsResponse {
  // Opaque IDs belong to the currently configured Mirakurun server.
  repeated Channel channels = 1;
}
message GetStateRequest {}
message GetStateResponse {
  // Always present in a successful response.
  PlayerState state = 1;
}
message WatchStateRequest {}
message WatchStateResponse {
  // Always present; never a delta.
  PlayerState state = 1;
}
message SelectChannelRequest {
  // Required. Mirakurun's opaque channel ID, not the catalog index or broadcast serviceId.
  optional uint64 channel_id = 1;
}
message SelectChannelResponse {}
message PlayRequest {}
message PlayResponse {}
message StopRequest {}
message StopResponse {}
message SetVolumeRequest {
  // Required, finite, inclusive range 0.0 to 1.0. Out-of-range values are rejected.
  optional double fraction = 1;
}
message SetVolumeResponse {}
message SetMutedRequest {
  // Required, including when setting false.
  optional bool muted = 1;
}
message SetMutedResponse {}
message SetSubtitlesRequest {
  // Required, including when setting false.
  optional bool visible = 1;
}
message SetSubtitlesResponse {}

message SetPausedRequest {
  // Required, including false.
  optional bool paused = 1;
}
message SetPausedResponse {}
message SeekRelativeRequest {
  // Required. Inclusive range -9007199254740991 to 9007199254740991.
  optional sint64 delta_ms = 1;
}
message SeekRelativeResponse {}
message SeekToRequest {
  // Required. Inclusive range 0 to 9007199254740991.
  optional uint64 position_ms = 1;
}
message SeekToResponse {}
message ReturnToLiveRequest {}
message ReturnToLiveResponse {}
message SetPlaybackRateRequest {
  // Required. 5 through 20 inclusive: 0.5x through 2.0x, in steps of 0.1x.
  optional int32 tenths = 1;
}
message SetPlaybackRateResponse {}
message StepChannelRequest {
  // Required. Exactly -1 (previous) or +1 (next).
  optional int32 offset = 1;
}
message StepChannelResponse {}
message PreviousChannelRequest {}
message PreviousChannelResponse {}
message SelectRemoteKeyRequest {
  // Required, 1 through 12 inclusive. Missing catalog match returns NOT_FOUND.
  optional uint32 number = 1;
  // UNSPECIFIED uses the viewed/selected band, or terrestrial with no selection.
  BroadcastBand band = 2;
}
message SelectRemoteKeyResponse {}
message SendKeyRequest {
  RemoteKey key = 1;
}
message SendKeyResponse {}
enum RemoteKey {
  REMOTE_KEY_UNSPECIFIED = 0;
  REMOTE_KEY_UP = 1;
  REMOTE_KEY_DOWN = 2;
  REMOTE_KEY_LEFT = 3;
  REMOTE_KEY_RIGHT = 4;
  REMOTE_KEY_OK = 5;
  REMOTE_KEY_BACK = 6;
  REMOTE_KEY_GUIDE = 7;
  REMOTE_KEY_CHANNELS = 8;
  REMOTE_KEY_FULLSCREEN = 9;
}
// Values emitted by Player.remote_command_executed(kind) after successful execution.
enum RemoteCommandKind {
  REMOTE_COMMAND_KIND_UNSPECIFIED = 0;
  REMOTE_COMMAND_KIND_SELECT_CHANNEL = 1;
  REMOTE_COMMAND_KIND_PLAY = 2;
  REMOTE_COMMAND_KIND_STOP = 3;
  REMOTE_COMMAND_KIND_SET_VOLUME = 4;
  REMOTE_COMMAND_KIND_SET_MUTED = 5;
  REMOTE_COMMAND_KIND_SET_SUBTITLES = 6;
  REMOTE_COMMAND_KIND_SET_PAUSED = 7;
  REMOTE_COMMAND_KIND_SEEK_RELATIVE = 8;
  REMOTE_COMMAND_KIND_SEEK_TO = 9;
  REMOTE_COMMAND_KIND_RETURN_TO_LIVE = 10;
  REMOTE_COMMAND_KIND_SET_PLAYBACK_RATE = 11;
  REMOTE_COMMAND_KIND_STEP_CHANNEL = 12;
  REMOTE_COMMAND_KIND_PREVIOUS_CHANNEL = 13;
  REMOTE_COMMAND_KIND_SELECT_REMOTE_KEY = 14;
  REMOTE_COMMAND_KIND_SEND_KEY = 15;
}

// A consistent projection of the player's authoritative state.
message PlayerState {
  // Increases on published state changes; resets when the API restarts.
  uint64 revision = 1;
  // May differ from the active channel after catalog updates or failed switches.
  optional uint64 selected_channel_id = 2;
  // Exactly one variant is present. An active variant always includes its target.
  oneof playback {
    StoppedPlayback stopped = 3;
    ActivePlayback connecting = 4;
    ActivePlayback playing = 5;
    ActivePlayback stop_failed = 6;
    FilePlayback file_connecting = 13;
    FilePlayback file_playing = 14;
    FilePlayback file_stop_failed = 15;
    FilePlayback file_paused = 16;
    FilePlayback file_seeking = 17;
    FilePlayback file_seeking_paused = 18;
    FilePlayback file_ended = 19;
    ActivePlayback paused = 20;
    ActivePlayback seeking = 21;
    ActivePlayback seeking_paused = 22;
    ActivePlayback ended = 23;
  }
  // Selected volume, even while muted, in the inclusive range 0.0 to 1.0.
  double volume_fraction = 7;
  bool muted = 8;
  SubtitleDisplay subtitles = 9;
  // Last playback error, empty if none. Human-readable; not a stable error code.
  string playback_error = 10;
  // Current program for the active channel, absent when unknown or stopped.
  Program current_program = 11;
  // Last settings write error; a successful control RPC does not guarantee persistence.
  string settings_error = 12;
  // Absent until known. Live values use the retained session timeline, not Unix time.
  optional uint64 position_ms = 24;
  // Recording duration, or the end of the live session timeline; absent if unknown.
  optional uint64 duration_ms = 25;
  // Both present together when seeking is available; endpoints are inclusive.
  optional uint64 seek_start_ms = 26;
  optional uint64 seek_end_ms = 27;
  // Applied speed; 10 means normal speed, even while inactive.
  int32 playback_rate_tenths = 28;
  bool can_pause = 29;
  bool can_seek = 30;
  bool can_return_to_live = 31;
  bool can_set_rate = 32;
  // True only while actively playing at the live edge (not paused near the edge).
  bool at_live_edge = 33;
  bool can_step_channel = 34;
  bool can_previous_channel = 35;
}
message StoppedPlayback {}
message FilePlayback {
  // Display filename only; the local filesystem path is not published.
  string name = 1;
}
message ActivePlayback {
  // Mirakurun catalog ID of the current stream attempt, retained on stop failure.
  uint64 channel_id = 1;
}
enum SubtitleDisplay {
  SUBTITLE_DISPLAY_UNSPECIFIED = 0;
  SUBTITLE_DISPLAY_DISABLED = 1;
  SUBTITLE_DISPLAY_HIDDEN = 2;
  SUBTITLE_DISPLAY_VISIBLE = 3;
}
message Channel {
  uint64 id = 1;
  string name = 2;
  string label = 3;
  BroadcastBand band = 4;
  // Current wall-clock EPG program; absent if unavailable or ambiguous.
  Program current_program = 5;
  // Desktop remote-control number, absent when unassigned/outside 1 through 12.
  optional uint32 remote_key = 6;
}
enum BroadcastBand {
  BROADCAST_BAND_UNSPECIFIED = 0;
  BROADCAST_BAND_TERRESTRIAL = 1;
  BROADCAST_BAND_BS = 2;
  BROADCAST_BAND_CS = 3;
  BROADCAST_BAND_SKY = 4;
  BROADCAST_BAND_OTHER = 5;
}
message Program {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  // Unix epoch milliseconds.
  uint64 start_at_ms = 4;
  uint64 duration_ms = 5;
}
