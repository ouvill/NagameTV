[package]
name = "viewer-epg-events"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[features]
network = ["dep:reqwest", "dep:tokio", "dep:futures-util"]

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls", "stream"]
optional = true

[dependencies.tokio]
version = "1.47"
features = ["rt", "time", "sync", "macros"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
