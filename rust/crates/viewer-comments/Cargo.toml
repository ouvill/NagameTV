[package]
name = "viewer-comments"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[features]
evaluation-collision-layout = []
network = ["dep:futures-util", "dep:reqwest", "dep:tokio", "dep:tokio-tungstenite", "dep:time"]

[dependencies.time]
version = "0.3"
default-features = false
features = ["parsing"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls"]
optional = true

[dependencies.tokio]
version = "1.47"
features = ["rt", "time", "sync", "net", "io-util"]
optional = true

[dependencies.tokio-tungstenite]
version = "0.28"
default-features = false
features = ["connect", "rustls-tls-webpki-roots"]
optional = true
