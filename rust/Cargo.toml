[package]
name = "mirakurun-viewer"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
# Builds a runner for QML tests using the real statically linked Rust types.
qml_tests = []

[dependencies]
viewer-epg-events = { path = "crates/viewer-epg-events", features = ["network"] }
viewer-diagnostics = { path = "crates/viewer-diagnostics" }
viewer-comments = { path = "crates/viewer-comments", features = ["network"] }
libaribcaption = { path = "crates/libaribcaption" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-base = { version = "0.25", features = ["v1_24"] }
gstreamer-mpegts = { version = "0.25.2", features = ["v1_24"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
toml = "0.9"
tempfile = "3.27"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
debug = 1

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[patch.crates-io]
qt-build-utils = { path = "vendor/qt-build-utils" }
