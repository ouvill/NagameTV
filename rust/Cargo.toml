[package]
name = "mirakurun-viewer"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
gstreamer = { version = "0.25", features = ["v1_24"] }
serde = { version = "1.0", features = ["derive"] }
ureq = { version = "2.12", features = ["json"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
