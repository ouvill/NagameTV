[package]
name = "mirakurun-viewer"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
gstreamer = { version = "0.25", features = ["v1_24"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
toml = "0.9"

[build-dependencies]
cmake = "0.1"
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
